name: Site quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check analytics.js
      - run: node --check language.js
      - run: node --check app-core.js
      - run: node --check app-game-checks.js
      - run: node --check app-log-runner.js
      - run: node --check app-ui.js
      - run: node --check regression.js
      - run: node --check compatibility-engine.js
      - run: node --check compatibility.js
      - run: node --check tools.js
      - run: node --test tests/*.test.mjs tests/*.test.cjs
      - run: node scripts/check-site.mjs
